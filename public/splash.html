<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>Welcome · HyperNIDLookUP</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round">

  <style>
    :root {
      --red-deep: #8a0016;
      --red-primary: #c1121f;
      --red-bright: #e63946;
      --red-soft: #ff6b7a;
      --white: #ffffff;
      --txt-dark: #1a0a0d;
      --txt-dim: #8a6b72;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', sans-serif;
      background: #ffffff;
      /* সাইটের ব্যাকগ্রাউন্ডের মতো হালকা গ্রেডিয়েন্ট */
      background-image: 
        radial-gradient(ellipse at 50% -20%, rgba(230, 57, 70, 0.15), transparent 60%),
        linear-gradient(180deg, #ffffff 0%, #fff5f6 45%, #ffeef0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* ব্যাকগ্রাউন্ডের ভাসমান অর্ব */
    .float-orb {
      position: absolute; border-radius: 50%; z-index: -1;
      pointer-events: none; animation: floatOrb 9s ease-in-out infinite;
    }
    .orb-1 { width: 12px; height: 12px; background: var(--red-bright); top: 20%; left: 15%; opacity: 0.5; }
    .orb-2 { width: 8px; height: 8px; background: var(--red-soft); top: 70%; right: 20%; opacity: 0.6; animation-delay: 1.5s; }
    .orb-3 { width: 15px; height: 15px; background: var(--red-primary); bottom: 15%; left: 10%; opacity: 0.4; animation-delay: 3s; }
    @keyframes floatOrb {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.2); }
    }

    /* মূল কন্টেইনার */
    .splash-content {
      text-align: center;
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
      position: relative;
      z-index: 1;
    }

    /* লোগো স্টাইল (সাইটের হেডারের মতো) */
    .brand-badge {
      width: 90px; height: 90px; border-radius: 24px;
      background: linear-gradient(145deg, var(--red-primary) 0%, var(--red-bright) 55%, var(--red-soft) 100%);
      display: flex; align-items: center; justify-content: center;
      position: relative; margin: 0 auto 24px;
      box-shadow: 0 0 0 4px rgba(193, 18, 31, 0.15), 0 16px 40px -10px rgba(193, 18, 31, 0.6);
      animation: pulseLogo 2s ease-in-out infinite;
    }
    
    .brand-badge::after {
      content: ''; position: absolute; inset: 4px; border-radius: 20px;
      background: linear-gradient(160deg, #a30015, #6e0011);
    }
    
    .brand-badge .material-icons-round {
      position: relative; z-index: 1; font-size: 48px; color: var(--white);
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.5));
    }

    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* টেক্সট স্টাইল */
    .brand-txt {
      font-family: 'Space Grotesk', sans-serif; font-weight: 700;
      font-size: 1.8rem; letter-spacing: -0.5px; line-height: 1.1; color: var(--txt-dark);
      margin-bottom: 6px;
    }
    .brand-txt em { font-style: normal; color: var(--red-primary); }
    
    .brand-sub {
      font-family: 'Outfit', sans-serif; font-weight: 500;
      font-size: 0.85rem; letter-spacing: 2px; color: var(--txt-dim);
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    /* ৩টি ডট লোডার */
    .dot-loader {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--red-primary);
      animation: bounceDot 1.4s ease-in-out infinite both;
    }
    
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    .dot:nth-child(3) { animation-delay: 0s; }

    @keyframes bounceDot {
      0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- ভাসমান অর্ব -->
  <div class="float-orb orb-1"></div>
  <div class="float-orb orb-2"></div>
  <div class="float-orb orb-3"></div>

  <div class="splash-content">
    <!-- লোগো -->
    <div class="brand-badge">
      <span class="material-icons-round">account_balance</span>
    </div>

    <!-- ব্র্যান্ড নাম -->
    <div class="brand-txt">
      Hyper<em>NID</em>LookUP
    </div>
    <div class="brand-sub">
      BD NID VERIFICATION
    </div>

    <!-- ৩টি ডট লোডার -->
    <div class="dot-loader">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <script>
    // ২.৫ সেকেন্ড পর ল্যান্ডিং পেজে নিয়ে যাবে
    setTimeout(() => {
      window.location.href = '/index.html';
    }, 2500);
  </script>
</body>
</html>
