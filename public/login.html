<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In · HyperNIDLookUP</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round">
  <style>
    :root {
      --red-primary: #c1121f;
      --red-bright: #e63946;
      --red-tint: #ffeef0;
      --txt-dark: #1a0a0d;
      --txt-dim: #8a6b72;
      --border-soft: rgba(193, 18, 31, 0.14);
      --border-strong: rgba(193, 18, 31, 0.32);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(180deg, #ffffff 0%, #fff5f6 45%, #ffeef0 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px 16px; color: var(--txt-dark);
    }
    .card {
      background: #fff; border: 1px solid var(--border-soft);
      border-radius: 30px; padding: 32px 24px;
      width: 100%; max-width: 420px;
      box-shadow: 0 20px 50px -20px rgba(193, 18, 31, 0.25);
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; text-decoration: none; color: var(--txt-dark); }
    .brand-badge {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(145deg, var(--red-primary), var(--red-bright));
      display: flex; align-items: center; justify-content: center; color: #fff; font-size: 22px;
    }
    .brand-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.05rem; letter-spacing: -0.4px; }
    h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.7rem; letter-spacing: -0.8px; margin: 18px 0 6px; }
    .sub { font-size: 0.9rem; color: var(--txt-dim); margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 0.78rem; font-weight: 500; color: var(--txt-dim); margin-bottom: 6px; }
    .field input {
      width: 100%; height: 50px; padding: 0 14px;
      font-family: 'Outfit', sans-serif; font-size: 0.95rem;
      background: #fff; border: 1.5px solid var(--border-soft);
      border-radius: 12px; outline: none; color: var(--txt-dark);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input:focus { border-color: var(--red-bright); box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.12); }
    .btn {
      width: 100%; height: 52px;
      background: linear-gradient(135deg, var(--red-primary), var(--red-bright));
      color: #fff; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 1rem;
      border: none; border-radius: 14px; cursor: pointer;
      box-shadow: 0 10px 24px -8px rgba(193, 18, 31, 0.5);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 6px;
    }
    .btn:hover:not(:disabled) { transform: translateY(-2px); }
    .btn:disabled { opacity: 0.65; cursor: not-allowed; }
    .footer-link { text-align: center; margin-top: 18px; font-size: 0.85rem; color: var(--txt-dim); }
    .footer-link a { color: var(--red-primary); text-decoration: none; font-weight: 600; }
    .alert { padding: 12px 14px; border-radius: 12px; font-size: 0.85rem; margin-bottom: 14px; display: none; }
    .alert.show { display: block; }
    .alert-error { background: #ffeef0; color: var(--red-primary); border: 1px solid var(--border-strong); }
    .forgot { text-align: right; margin-top: -6px; margin-bottom: 10px; }
    .forgot a { font-size: 0.8rem; color: var(--red-primary); text-decoration: none; font-weight: 500; }
    .spinner {
      width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <a href="/" class="brand">
      <span class="brand-badge material-icons-round">account_balance</span>
      <span class="brand-name">HyperNIDLookUP</span>
    </a>

    <h1>Welcome back</h1>
    <p class="sub">Log in to access your dashboard.</p>

    <div class="alert alert-error" id="errBox"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password" required>
      </div>
      <div class="forgot"><a href="#">Forgot password?</a></div>

      <button type="submit" class="btn" id="submitBtn">
        Log In
        <span class="material-icons-round" style="font-size:20px;">login</span>
      </button>
    </form>

    <p class="footer-link">
      Don't have an account? <a href="/signup.html">Sign up free</a>
    </p>
  </div>

  <script type="module">
    import { supabase } from '/supabase-client.js';

    const form = document.getElementById('loginForm');
    const errBox = document.getElementById('errBox');
    const submitBtn = document.getElementById('submitBtn');

    function showError(msg) {
      errBox.textContent = msg;
      errBox.classList.add('show');
    }

    // Redirect if already logged in
    const { data: { session } } = await supabase.auth.getSession();
    if (session) window.location.href = '/dashboard.html';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.remove('show');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) return showError('Please fill in all fields.');

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Logging in…';

      const { error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Log In <span class="material-icons-round" style="font-size:20px;">login</span>';
        return showError(error.message);
      }

      window.location.href = '/dashboard.html';
    });
  </script>
</body>
</html>
