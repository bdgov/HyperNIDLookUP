<body>
  <div class="card">
    <a href="/" class="brand">
      <span class="brand-badge material-icons-round">account_balance</span>
      <span class="brand-name">HyperNIDLookUP</span>
    </a>

    <h1>Create your account</h1>
    <p class="sub">Free signup. Pay only when you buy a package.</p>

    <div class="alert alert-error" id="errBox"></div>
    <div class="alert alert-success" id="okBox"></div>

    <form id="signupForm" novalidate>
      <div class="field">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Your full name" required minlength="3">
      </div>
      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Minimum 8 characters" required minlength="8">
      </div>

      <div class="captcha">
        <div class="captcha-label">Bot protection</div>
        <div class="captcha-question" id="captchaQ">What is <span>?</span></div>
        <div class="field" style="margin-bottom:0;">
          <input type="number" id="captchaAnswer" placeholder="Your answer" required>
        </div>
      </div>

      <button type="submit" class="btn" id="submitBtn">
        Create Account
        <span class="material-icons-round" style="font-size:20px;">arrow_forward</span>
      </button>
    </form>

    <p class="footer-link">
      Already have an account? <a href="/login.html">Log in</a>
    </p>
  </div>

  <script type="module">
    import { supabase } from '/supabase-client.js';

    // ---- Math Captcha ----
    let captchaAnswer = 0;
    function newCaptcha() {
      const a = Math.floor(Math.random() * 9) + 2;
      const b = Math.floor(Math.random() * 9) + 2;
      const ops = ['+', '−', '×'];
      const op = ops[Math.floor(Math.random() * ops.length)];
      let ans;
      if (op === '+') ans = a + b;
      else if (op === '−') ans = a - b;
      else ans = a * b;
      captchaAnswer = ans;
      document.getElementById('captchaQ').innerHTML =
        `What is <span>${a} ${op} ${b}</span>?`;
      document.getElementById('captchaAnswer').value = '';
    }
    newCaptcha();

    // ---- Form submit ----
    const form = document.getElementById('signupForm');
    const errBox = document.getElementById('errBox');
    const okBox = document.getElementById('okBox');
    const submitBtn = document.getElementById('submitBtn');

    function showError(msg) {
      errBox.textContent = msg;
      errBox.classList.add('show');
      okBox.classList.remove('show');
    }
    function showOk(msg) {
      okBox.textContent = msg;
      okBox.classList.add('show');
      errBox.classList.remove('show');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.remove('show');

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const answer = parseInt(document.getElementById('captchaAnswer').value, 10);

      // Validations
      if (fullName.length < 3) return showError('Name must be at least 3 characters.');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('Invalid email address.');
      if (password.length < 8) return showError('Password must be at least 8 characters.');
      if (isNaN(answer) || answer !== captchaAnswer) {
        showError('Captcha answer is incorrect.');
        newCaptcha();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Creating…';

      const { error } = await supabase.auth.signUp({
        email,
        password,
        options: { data: { full_name: fullName } }
      });

      if (error) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Create Account <span class="material-icons-round" style="font-size:20px;">arrow_forward</span>';
        newCaptcha();
        return showError(error.message);
      }

      showOk('Account created! Check your email to verify, then log in.');
      submitBtn.innerHTML = '<span class="material-icons-round" style="font-size:20px;">check_circle</span> Done';
      setTimeout(() => {
        window.location.href = '/login.html';
      }, 2200);
    });
  </script>
</body>
</html>
